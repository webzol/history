<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>史页 · 预览 Harness</title>
<style>
  html, body { margin: 0; padding: 0; background: #E8E2D8; }
  body { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; }

  #phone {
    position: relative;
    width: 390px;
    height: 844px;
    margin: 24px auto;
    overflow: hidden;
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,.18);
    background: #F6F1EA;
  }
  #page-host { position: absolute; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; }
  #page-style { display: none; }

  /* 自绘元素基线（见 harness 说明） */
  view, w-view { display: block; }
  text, e-text { display: inline; }
  w-block { display: contents; }
  image, img { display: inline-block; }
  input { font: inherit; color: inherit; outline: none; border: none; background: #FCFBF8; }

  /* ------------------------------------------------------------------ */
  /* wx 原生组件 mock（视觉近似）                                         */
  /* ------------------------------------------------------------------ */
  overlay-root {
    position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
    z-index: 9999; pointer-events: none;
  }
  ov-mask {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,.45); pointer-events: auto;
  }
  ov-modal {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 300px; border-radius: 16px; background: #fff;
    overflow: hidden; pointer-events: auto;
    font-size: 15px; line-height: 1.5; color: #333;
  }
  ov-title { display: block; padding: 22px 18px 8px; font-weight: 600; text-align: center; }
  ov-content { display: block; padding: 4px 18px 20px; max-height: 320px; overflow: auto; white-space: pre-wrap; }
  ov-line { display: block; }
  ov-btns { display: flex; border-top: 1px solid #f0f0f0; }
  ov-btn {
    flex: 1; padding: 13px 0; text-align: center; font-weight: 500; color: #576B95;
    cursor: pointer; user-select: none;
  }
  ov-btn + ov-btn { border-left: 1px solid #f0f0f0; }
  ov-btn:active { background: #f6f6f6; }

  ov-sheet {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: #fff; border-radius: 16px 16px 0 0;
    padding-bottom: 18px; pointer-events: auto;
  }
  ov-alert {
    display: block; text-align: center; color: #888; font-size: 14px;
    padding: 20px 16px 4px;
  }
  ov-item {
    display: block; padding: 15px 16px; text-align: center;
    border-bottom: 1px solid #f0f0f0; color: #1F1D19; cursor: pointer;
  }
  ov-item:last-child, ov-item.cancel { border-bottom: none; color: #999; border-top: 6px solid #f6f6f6; }
  ov-item:active { background: #f6f6f6; }

  ov-toast {
    position: absolute; left: 50%; top: 46%; transform: translate(-50%,-50%);
    background: rgba(20,20,20,.78); color: #fff; font-size: 14px;
    padding: 12px 18px; border-radius: 10px; max-width: 240px; text-align: center;
  }

  /* 错误条（自测可见） */
  /* 截图模式（?shot=1）：手机固定 390×844，由 harness 按视口 transform 适配 */
  body.shot { background: #F6F1EA; }
  body.shot #phone {
    margin: 0;
    width: 390px;
    height: 844px;
    border-radius: 0;
    box-shadow: none;
    transform-origin: 0 0;
  }
  body.shot #page-host { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  body.shot overlay-root { position: fixed; }
  @media (prefers-reduced-motion: no-preference) { /* 无动画需求 */ }

  err-banner {
    position: fixed; left: 0; top: 0; z-index: 9999; display: none;
    max-width: 100vw;
  }
  err-banner div {
    background: #B33; color: #fff; font-size: 12px; padding: 4px 10px;
  }
  err-banner:not(:empty) { display: block; }
</style>
</head>
<body>
  <err-banner id="err-banner"></err-banner>
  <div id="phone">
    <div id="page-host"></div>
  </div>
  <style id="page-style"></style>
  <script src="_bundle.js"></script>
  <script src="harness.js"></script>
</body>
</html>
